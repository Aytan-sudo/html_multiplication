<!DOCTYPE html>
<html lang="fr" class="page-doc">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="theme-color" content="#f8c3d3">
    <title>Meilleurs scores - Multiplication</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/img/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="assets/img/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="commun/passeport.css">
    <script src="js/viewport.js"></script>
</head>
<body>
    <main class="app">
        <div class="passeport-ruban" data-passeport-ruban data-jeu="html_multiplication"></div>
        <div class="panel">
            <h1 class="page-title">Meilleurs scores</h1>

            <div class="filters">
                <label class="option">
                    <input type="checkbox" data-filter="operation" value="multiplication" checked>
                    <span>Multiplication</span>
                </label>
                <label class="option">
                    <input type="checkbox" data-filter="operation" value="addition" checked>
                    <span>Addition</span>
                </label>
                <label class="option">
                    <input type="checkbox" data-filter="difficulty" value="easy" checked>
                    <span>Facile</span>
                </label>
                <label class="option">
                    <input type="checkbox" data-filter="difficulty" value="hard" checked>
                    <span>Difficile</span>
                </label>
            </div>

            <div id="scores" class="scores"></div>

            <div class="button-group">
                <button type="button" id="clear-button" class="danger-btn">Tout effacer</button>
                <button type="button" id="back-button" class="primary-btn">Retour au jeu</button>
            </div>
        </div>
    </main>

    <script src="commun/passeport.js"></script>
    <script src="commun/liaison.js" defer></script>
    <script src="js/storage.js"></script>
    <script src="js/config.js"></script>
    <script src="js/highscores-page.js" defer></script>
    <script src="js/register-sw.js" defer></script>
</body>
</html>
