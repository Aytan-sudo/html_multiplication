<!DOCTYPE html>
<html lang="fr" class="page-game">
<head>
    <meta charset="UTF-8">
    <!-- interactive-widget=resizes-content sert a Android : le clavier y
         retrecit la zone de mise en page au lieu de recouvrir le contenu.
         Safari ne connait pas la cle et l'ecrit en avertissement dans la
         console, donc js/viewport.js ne l'ajoute que hors WebKit ; sur iOS,
         c'est deja lui qui prend le relais. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#f8c3d3">
    <meta name="description" content="Jeu educatif pour reviser les tables de multiplication et d'addition.">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Multiplication">
    <title>Multiplication</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/img/icon-192.png" sizes="192x192">
    <link rel="apple-touch-icon" href="assets/img/icon-192.png">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="commun/passeport.css">
    <!-- Sans defer : la hauteur reelle doit etre connue avant le premier
         rendu, sinon le jeu s'affiche brievement a la mauvaise taille. -->
    <script src="js/viewport.js"></script>
</head>
<body>
    <main class="app">
        <div class="passeport-ruban" data-passeport-ruban data-jeu="html_multiplication"></div>
        <header class="topbar">
            <button id="sound-toggle" class="icon-btn" type="button" title="Couper ou remettre le son" aria-pressed="false">
                <img src="assets/img/unmute.webp" alt="Son active" width="40" height="40">
            </button>
            <div class="topbar-right">
                <div id="nav-links" class="topbar-right">
                    <a href="highscores.html" class="icon-btn" title="Meilleurs scores">
                        <img src="assets/img/trophee.webp" alt="Meilleurs scores" width="40" height="40">
                    </a>
                    <a href="config.html" class="icon-btn icon-btn--spin" title="Configuration">
                        <img src="assets/img/config.webp" alt="Configuration" width="40" height="40">
                    </a>
                </div>
                <button id="quit-btn" class="text-btn" type="button" hidden>Quitter</button>
            </div>
        </header>

        <!-- Ecran titre -->
        <section id="screen-title" class="screen screen--center">
            <h1 class="game-title">Multiplication</h1>
            <button id="start-btn" class="primary-btn" type="button">C'est parti !</button>
            <p id="mode-summary" class="mode-summary"></p>
        </section>

        <!-- Ecran de jeu -->
        <section id="screen-game" class="screen" hidden>
            <div class="score-zone">
                <div id="diamonds" class="diamonds" role="img" aria-label="Score"></div>
                <p id="progress" class="progress"></p>
            </div>

            <div class="question-area">
                <!-- La zone souple centre le contenu ; c'est la boite interne,
                     dimensionnee par son contenu, qui porte le retour visuel :
                     un flash sur la zone entiere remplissait tout l'ecran. -->
                <div id="question-box" class="question-box">
                <p class="question">
                    <span id="num-a"></span>
                    <span id="operator"></span>
                    <span id="num-b"></span>
                </p>

                <form id="answer-form" class="answer-form" novalidate>
                    <label class="sr-only" for="answer-input">Ta reponse</label>
                    <input id="answer-input"
                           type="text"
                           inputmode="numeric"
                           pattern="[0-9]*"
                           enterkeyhint="done"
                           autocomplete="off"
                           autocorrect="off"
                           spellcheck="false"
                           maxlength="4"
                           placeholder="?">
                    <button type="submit" class="primary-btn primary-btn--compact">OK</button>
                </form>
                </div>
            </div>

            <div class="timer">
                <div class="timer-track">
                    <div id="timer-fill" class="timer-fill"></div>
                </div>
                <span id="timer-value" class="timer-value"></span>
            </div>
        </section>

        <!-- Ecran de victoire -->
        <section id="screen-victory" class="screen screen--center" hidden>
            <h2 class="victory-title">Victoire !</h2>
            <dl class="victory-stats">
                <div><dt>Temps</dt><dd id="victory-time"></dd></div>
                <div><dt>Rang</dt><dd id="victory-rank"></dd></div>
                <div><dt>Erreurs</dt><dd id="victory-mistakes"></dd></div>
                <div><dt>Mode</dt><dd id="victory-mode" class="victory-mode"></dd></div>
            </dl>
            <div class="victory-actions">
                <button id="replay-btn" class="primary-btn" type="button">Rejouer</button>
                <button id="home-btn" class="secondary-btn" type="button">Ecran titre</button>
            </div>
        </section>
    </main>

    <!-- Pause automatique quand on quitte l'onglet ou l'application -->
    <div id="pause-overlay" class="pause-overlay" hidden>
        <div class="pause-box">
            <p>Partie en pause</p>
            <button id="resume-btn" class="primary-btn" type="button">Reprendre</button>
        </div>
    </div>

    <script src="commun/passeport.js"></script>
    <script src="commun/liaison.js" defer></script>
    <script src="js/storage.js"></script>
    <script src="js/config.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/vendor/confetti.min.js" defer></script>
    <script src="js/game.js" defer></script>
    <script src="js/register-sw.js" defer></script>
</body>
</html>
